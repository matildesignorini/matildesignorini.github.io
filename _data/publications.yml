# One entry per paper. Order doesn't matter — the site sorts them.
#
#   title:    paper title
#   authors:  list of authors, written the way they appear in the paper.
#             Write your own name exactly as `me:` in _config.yml so it's
#             shown in bold and first-author papers are detected.
#   journal:  journal name (or "Submitted", "In prep.")
#   year / month: numbers
#   topics:   one or more topic names from _data/profile.yml
#   ads / arxiv / doi / pdf: links (leave out the ones you don't have)

- title: Placeholder title of a first-author paper about topic one
  authors: ["Signorini, M.", "Coauthor, A.", "Coauthor, B."]
  journal: ApJ
  year: 2026
  month: 3
  topics: [Topic one]
  ads: https://ui.adsabs.harvard.edu/
  arxiv: https://arxiv.org/

- title: Placeholder title of a co-authored paper spanning two topics
  authors: ["Coauthor, A.", "Signorini, M.", "Coauthor, C."]
  journal: A&A
  year: 2025
  month: 11
  topics: [Topic two, Topic three]
  ads: https://ui.adsabs.harvard.edu/

- title: Another first-author paper, this time on topic two
