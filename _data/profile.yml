# ---- Research interests ----
# Each topic has a colour: yellow, ochre, blue, sky, green or orange
# (defined in assets/css/style.css). Tag publications with these same
# topic names to group and colour them on the site.
# The descriptions are drafts: check and rewrite them in your own words.
interests:
  - topic: Disc–corona interaction
    color: yellow
    text: >-
      How the hot X-ray corona and the accretion disc are coupled, and what
      the link between their UV and X-ray emission tells us about how
      supermassive black holes accrete.
  - topic: Cosmology with AGN
    color: blue
    text: >-
      Measuring distances with AGN using different methods (the
      L<sub>X</sub>–L<sub>UV</sub> relation, X-ray variability and the size of
      the Broad Line Region), and testing cosmological models together with
      other probes.
  - topic: Obscuration and outflows
    color: green
    text: >-
      How much of the AGN population is hidden behind gas and dust, and how
      this changes over cosmic time, using deep X-ray surveys such as the
      Chandra J1030 field. With XRISM, I also study the gas close to the black
      hole in detail, through iron-line diagnostics and ionised outflows in
      NGC&nbsp;3783.
  - topic: High-redshift AGN
    color: sky
    text: >-
      The most distant quasars, including the ones discovered by JWST, and
      what they reveal about how supermassive black holes formed and grew in
      the early Universe.
  - topic: BASS collaboration
    color: orange
    text: >-
      Member of the BAT AGN Spectroscopic Survey, a multiwavelength study
      of the hard X-ray selected AGN detected by *Swift*/BAT.
  - topic: STORM2 collaboration
    color: ochre
    text: >-
      Member of AGN STORM 2, an intensive multiwavelength reverberation
      mapping campaign on the Seyfert galaxy Mrk 817, probing the Broad
      Line Region and the black hole mass.

