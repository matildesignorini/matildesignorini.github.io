# Short bio. Markdown works: *italics*, **bold**, [links](https://...)
# Leave an empty line between paragraphs.
bio: |
  I'm an observational astronomer studying active galactic nuclei (AGN).
  My work is centred on X-rays, and I also analyse UV and infrared data.

  I want to understand how AGN work: in particular, how the X-ray-emitting
  corona interacts with the accretion disc, and how reverberation mapping
  can measure supermassive black hole masses and probe the Broad Line
  Region. I also study the obscured AGN population: how it evolves, how
  X-ray observations can trace it, and what it tells us about how black
  holes and their host galaxies grow together.

  Beyond their structure, I'm interested in AGN as cosmological probes.
  Because they are extremely luminous and found across a wide range of
  redshifts, they can be used to measure distances and test cosmological
  models.

