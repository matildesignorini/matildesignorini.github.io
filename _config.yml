# Site settings
title: Matilde Signorini
description: >-
  Matilde Signorini, astrophysicist and ESA Research Fellow at ESTEC,
  working on active galactic nuclei (AGN), X-ray astronomy and cosmology
  with quasars.
url: "https://matildesignorini.com"
baseurl: ""
lang: en

# How your name appears in author lists. Any author that matches this
# exactly is shown in bold, and a paper where it comes first counts as
# "first author".
me: "Signorini, M."

plugins:
  - jekyll-sitemap      # writes /sitemap.xml for search engines

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - scripts
  - vendor
